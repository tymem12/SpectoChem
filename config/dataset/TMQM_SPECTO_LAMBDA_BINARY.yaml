name: TMQM_SPECTO
root_dir: data/datasets/TMQM_SPECTO
pre_transforms: {}
transforms: 
  AddEdgesAndDistances:
    cutoff: 5.0
in_channels: 1
out_channels: 2
task_type: multiregression
split_ratios: [0.8, 0.1]
metric_mode: min
main_metric: MAE
additional_loading_params: 
  prediction_type: lambda_binary
  num_states: 2
  vis_range: [380, 650]
  block_3_only: True
  filter_type: one_visible_lambda #all_samples
  filter_f_value: 0.001
  min_f_value: 0.001
  sort_by_max_f: false
  standarize_lambda: true
  standarize_f: false
  
