name: TMQM_SPECTO
root_dir: data/datasets/TMQM_SPECTO
pre_transforms: {}
transforms: 
  AddEdgesAndDistances:
    cutoff: 5.0
in_channels: 1
out_channels: 4
task_type: multiregression
split_ratios: [0.8, 0.1]
metric_mode: min
main_metric: MAE
additional_loading_params: 
  prediction_type: lambda_binary
  num_states: 4
  vis_range: [380, 750]
  block_3_only: True
  filter_type: all_visible_lambdas #all_samples
  min_f_value: 0.02
  sort_by_max_f: True
  standarize_lambda: false
  standarize_f: false
  
