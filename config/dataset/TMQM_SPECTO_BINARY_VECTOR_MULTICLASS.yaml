name: TMQM_SPECTO
root_dir: data/datasets/TMQM_SPECTO
pre_transforms: {}
transforms: 
  AddEdgesAndDistances:
    cutoff: 5.0
in_channels: 1
out_channels: 64
task_type: multiclass
split_ratios: [0.8, 0.1]
metric_mode: max
main_metric: F1
additional_loading_params: 
  prediction_type: binary_vector_multiclass
  num_states: 1
  vis_range: [330, 650]
  block_3_only: True
  filter_type: one_visible_lambda   # all_samples, one_visible_lambda
  min_f_value: 0.01
  filter_f_value: 0.01
  sort_by_max_f: false
  standarize_lambda: false
  standarize_f: false
  lambda_bucket_size: 5


