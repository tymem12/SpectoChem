name: questions
root_dir: data/datasets
num_neighbors: [ 10, 10, 10 ]
num_hops: 3
in_channels: 301
out_channels: 1
task_type: binary
main_metric: AUROC
metric_mode: max
pre_transforms:
  # split sizes based on https://arxiv.org/abs/2302.11640
  RandomNodeSplit:
    split: train_rest
    num_splits: 10
    num_val: 0.25
    num_test: 0.25
transforms:
  NormalizeFeatures: { }
num_partitions: 4_800 # used only when using subgraph_method = cluster
