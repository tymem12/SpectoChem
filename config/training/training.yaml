experiment_name: ???
experiment_dir: data/experiments/${.experiment_name}
use_tensorboard: true
use_wandb: false
wandb_project: graph-jepa

random_seed: 2137
learning_rate: 5e-4
weight_decay: 1e-4
batch_size: 32
min_epochs: 1
max_epochs: 100
early_stopping: 
  monitor: val_${dataset.main_metric}
  mode: ${dataset.metric_mode}
  patience: 10
checkpoint:
  monitor: val_${dataset.main_metric}
  mode: ${dataset.metric_mode}
save_representations: false
scheduler_config:
  warmup_epochs: 10
  warmup_start_lr: 1e-6
  eta_min: 1e-6