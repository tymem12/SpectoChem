gnn_cls: gjepa.models.backbones.xgboost.XGBoostBinaryBackbone
encoding_field: positional_encoding
pooling: mean
search_n_iter: 20
params:
  n_estimators: 200
  max_depth: 8
  learning_rate: 0.03
  use_label_encoder: false
  eval_metric: logloss
  colsample_bytree: 0.8
  subsample: 1.0
