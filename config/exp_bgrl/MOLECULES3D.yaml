# @package _global_

defaults:
  - ../dataset@dataset: MOLECULES3D
  - ../backbone@backbone: gcn_2_layer
  - ../training@training: training
  - ../pos_encoding@pos_encoding: spherical_harmonics
  - override ../training@training: training
  - _self_

baseline_name: bgrl-postpool

predictor:
  hidden_channels: 512
  act: prelu
  act_kwargs:
    num_parameters: 1
  norm: null
  dropout: 0.0


training:
  max_epochs: 100
  learning_rate: 5e-4
  weight_decay: 1e-5
  batch_size: 128
  scheduler_config:
    warmup_epochs: 10
    max_epochs: ${..max_epochs}

drop_edge_p1: 0.2
drop_feat_p1: 0.1
drop_edge_p2: 0.1
drop_feat_p2: 0.2
