<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spectochem</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fa;
            color: #333;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            text-align: center;
            padding: 2rem;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 1rem;
            color: #2c3e50;
        }

        h2 {
            font-size: 1.5rem;
            font-weight: normal;
            color: #555;
            margin-bottom: 2rem;
        }

        .badge {
            display: inline-block;
            padding: 0.8rem 1.5rem;
            background: #ffc107;
            color: #000;
            border-radius: 8px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Spectochem</h1>
        <h2>Model for Predicting Photocatalysts</h2>
        <div class="badge">🚧 Work in Progress 🚧</div>
    </div>
</body>
</html>
